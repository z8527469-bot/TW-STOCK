name: 台股大戶籌碼增量更新

on:
  schedule:
    # 台灣時間週六 12:00 = UTC 時間週六 04:00
    - cron: '0 4 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-chips:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 下載程式碼
        uses: actions/checkout@v4

      - name: 🐍 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4 lxml html5lib

      - name: 🚀 執行集保增量更新與冷啟動爬蟲
        run: |
          python chip_tracker.py

      - name: 💾 自動將籌碼數據推播回 GitHub
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add data/holders.json
          git commit -m "🐳 自動更新大戶籌碼歷史資料 ($(date +'%Y-%m-%d'))" || echo "無資料變更"
          git push
