name: 台股週六長線趨勢掃描

on:
  schedule:
    # 台灣時間週六 14:00 = UTC 時間週六 06:00
    - cron: '0 6 * * 6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-weekly-screener:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 下載程式碼
        uses: actions/checkout@v4

      - name: 🐍 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests tqdm

      - name: 🚀 執行週六趨勢掃描
        run: |
          python weekly_uptrend.py

      - name: 💾 自動將最新 JSON 數據推播回 GitHub
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add data/weekly_uptrend.json
          git commit -m "📊 自動更新每週第二階段趨勢股 ($(date +'%Y-%m-%d'))" || echo "無資料變更"
          git push
