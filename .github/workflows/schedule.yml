name: 台股自動選股機器人

on:
  schedule:
    # 伺服器使用 UTC 時間。台灣時間 15:00 = UTC 07:00
    # 1-5 代表每週一到週五執行
    - cron: '40 14 * * *'
  workflow_dispatch: # 保留這個設定，讓你可以隨時手動點擊執行

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests lxml tqdm

      - name: 執行選股程式
        env:
          # 將剛剛設定的密鑰注入給 Python 程式使用
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python screener.py
