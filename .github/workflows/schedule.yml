name: 台股盤後選股機器人

on:
  schedule:
    # GitHub Actions 使用 UTC 時間。
    # 台灣時間 (UTC+8) 下午 15:00 = UTC 早上 07:00
    # 設定每週一到週五的 UTC 07:00 執行
    - cron: '0 13 * * 1-5'
  workflow_dispatch: # 允許在 GitHub 網頁上手動點擊 "Run workflow" 按鈕測試

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 下載程式碼
        uses: actions/checkout@v3

      - name: 🐍 設定 Python 環境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 安裝相依套件
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests lxml tqdm

      - name: 🚀 執行選股程式並發送 Discord
        env:
          # 將 GitHub Secrets 注入到 Python 的環境變數中
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          python screener.py
