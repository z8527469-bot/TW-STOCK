<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股七核心動能戰情室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        twred: '#ef4444',
                        twgreen: '#10b981'
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        .tab-active { border-bottom: 2px solid #3b82f6; color: #60a5fa; font-weight: 600; }
    </style>
</head>
<body class="bg-darkbg text-gray-200 min-h-screen pb-12">

    <!-- 頂部導覽列 -->
    <header class="bg-cardbg border-b border-gray-800 sticky top-0 z-10 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row justify-between items-center gap-2">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">📈</span>
                <h1 class="text-xl font-bold text-white tracking-wide">台股七核心動能戰情室</h1>
            </div>
            <div class="text-sm text-gray-400">
                最新選股日期：<span id="update-date" class="font-mono text-blue-400 font-semibold">載入中...</span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6">
        
        <!-- 歷史績效總覽卡片 (會隨篩選器動態更新) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-cardbg p-5 rounded-xl border border-gray-800 shadow">
                <div class="text-gray-400 text-sm mb-1">追蹤個股檔數 (已合併重複)</div>
                <div id="stat-total" class="text-2xl font-bold text-white font-mono">0</div>
            </div>
            <div class="bg-cardbg p-5 rounded-xl border border-gray-800 shadow">
                <div class="text-gray-400 text-sm mb-1">當前篩選正報酬勝率</div>
                <div id="stat-winrate" class="text-2xl font-bold text-white font-mono">0.0%</div>
            </div>
            <div class="bg-cardbg p-5 rounded-xl border border-gray-800 shadow">
                <div class="text-gray-400 text-sm mb-1">當前篩選平均報酬率</div>
                <div id="stat-avg-return" class="text-2xl font-bold text-white font-mono">0.00%</div>
            </div>
        </div>

        <!-- 頁籤切換 -->
        <div class="flex border-b border-gray-800 mb-6 space-x-4 sm:space-x-6 overflow-x-auto whitespace-nowrap">
            <button onclick="switchTab('daily')" id="tab-daily" class="pb-3 px-2 tab-active transition-colors shrink-0">
                🎯 最新選股名單
            </button>
            <button onclick="switchTab('history')" id="tab-history" class="pb-3 px-2 text-gray-400 hover:text-gray-200 transition-colors shrink-0">
                📊 歷史績效追蹤庫
            </button>
            <button onclick="switchTab('uptrend')" id="tab-uptrend" class="pb-3 px-2 text-gray-400 hover:text-gray-200 transition-colors shrink-0">
                🌊 第2階段大趨勢股 (每週)
            </button>
        </div>

        <!-- 區塊 1：今日最新選股 -->
        <div id="section-daily" class="space-y-6">
            <div id="daily-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="col-span-full text-center py-12 text-gray-500">正在載入今日選股資料...</div>
            </div>
        </div>

        <!-- 區塊 2：歷史績效追蹤 -->
        <div id="section-history" class="hidden">
            <!-- 搜尋與過濾工具列 -->
            <div class="grid grid-cols-
