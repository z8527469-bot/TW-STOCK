<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TW-STOCK 戰情室</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        up: '#ef4444',
                        down: '#22c55e',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .tab-btn.active { border-bottom: 2px solid #3b82f6; color: #3b82f6; font-weight: bold; }
        .badge-gold { background: rgba(234, 179, 8, 0.2); color: #fde047; border-color: rgba(234, 179, 8, 0.5); }
    </style>
</head>
<body class="bg-darkbg text-gray-200 min-h-screen p-4 md:p-8">
    <div class="max-w-7xl mx-auto">
        
        <!-- Header -->
        <header class="flex justify-between items-center mb-8 pb-4 border-b border-gray-800">
            <div>
                <h1 class="text-3xl font-bold text-white flex items-center gap-3">
                    🚀 台股量化戰情室
                </h1>
                <p id="update-time" class="text-sm text-gray-400 mt-2">最後更新：載入中...</p>
            </div>
        </header>

        <!-- Tabs Navigation -->
        <div class="flex gap-6 border-b border-gray-700 mb-6 overflow-x-auto">
            <button onclick="switchTab('daily')" id="tab-daily" class="tab-btn active pb-2 px-1 whitespace-nowrap">🔥 今日選股</button>
            <button onclick="switchTab('history')" id="tab-history" class="tab-btn pb-2 px-1 whitespace-nowrap">📈 歷史追蹤</button>
            <button onclick="switchTab('weekly')" id="tab-weekly" class="tab-btn pb-2 px-1 whitespace-nowrap">🎯 週級趨勢/轉折</button>
            <button onclick="switchTab('holders')" id="tab-holders" class="tab-btn pb-2 px-1 whitespace-nowrap">🐳 大戶籌碼追蹤</button>
        </div>

        <!-- 內容區塊: 每日選股 -->
        <div id="content-daily" class="block">
            <div id="daily-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                <p class="text-gray-400">載入中...</p>
            </div>
        </div>

        <!-- 內容區塊: 歷史追蹤 -->
        <div id="content-history" class="hidden">
            <div class="mb-4 flex flex-col sm:flex-row gap-4 justify-between items-center bg-cardbg p-4 rounded-xl border border-gray-800">
                <h2 class="text-xl font-bold text-white">波段表現追蹤</h2>
                <select id="strat-filter" onchange="renderHistory()" class="bg-darkbg border border-gray-700 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-blue-500">
                    <option value="ALL">🎯 所有策略 (S1 ~ S7)</option>
                    <option value="S1_底部突破">S1_底部突破</option>
                    <option value="S2_創高動能">S2_創高動能</option>
                    <option value="S3_投信認養">S3_投信認養</option>
                    <option value="S4_強勢回測網球">S4_強勢回測網球</option>
                    <option value="S5_投信作帳VCP">S5_投信作帳VCP</option>
                    <option value="S6_營收口袋樞紐">S6_營收口袋樞紐</option>
                    <option value="S7_漲停強勢旗形">S7_漲停強勢旗形</option>
                    <option value="👑週轉折共振">👑 週轉折共振</option>
                    <option value="🐳">🐳 大戶籌碼加持</option>
                    <option value="⚡RS創高">⚡ RS領先創高</option>
                </select>
            </div>
            <div class="overflow-x-auto bg-cardbg rounded-xl border border-gray-800">
                <table class="w-full text-sm text-left">
                    <thead class="text-xs uppercase bg-gray-800/50 text-gray-400">
                        <tr>
                            <th class="px-4 py-3">代碼</th>
                            <th class="px-4 py-3">入選日期</th>
                            <th class="px-4 py-3">觸發策略</th>
                            <th class="px-4 py-3 text-right">進場價</th>
                            <th class="px-4 py-3 text-right">最新價</th>
                            <th class="px-4 py-3 text-right text-blue-300">波段最高</th>
                            <th class="px-4 py-3 text-right">目前報酬</th>
                            <th class="px-4 py-3 text-right text-yellow-300">最大漲幅(MFE)</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody" class="divide-y divide-gray-800">
                        <tr><td colspan="8" class="text-center py-4 text-gray-500">載入中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 內容區塊: 週級資料 -->
        <div id="content-weekly" class="hidden space-y-8">
            <div class="bg-cardbg rounded-xl border border-gray-800 p-5">
                <h2 class="text-xl font-bold text-white mb-4">🏆 本週強勢多頭排列 (W_UpTrend)</h2>
                <div id="weekly-uptrend-container" class="flex flex-wrap gap-2"></div>
            </div>
            <div class="bg-cardbg rounded-xl border border-gray-800 p-5">
                <h2 class="text-xl font-bold text-white mb-4">🔄 關鍵三週轉折之上 (W_Turn)</h2>
                <div id="weekly-turn-container" class="flex flex-wrap gap-2"></div>
            </div>
        </div>

        <!-- 內容區塊: 籌碼追蹤 -->
        <div id="content-holders" class="hidden">
            <div class="bg-cardbg rounded-xl border border-gray-800 p-6">
                <h2 class="text-xl font-bold text-white mb-4">大戶籌碼折線圖 (每週集保)</h2>
                <div class="flex gap-3 mb-6">
                    <input type="text" id="chip-input" placeholder="輸入股票代碼 (例: 2330)" class="bg-darkbg border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-blue-500">
                    <button onclick="drawChipChart()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition-colors">查詢</button>
                </div>
                <div class="h-[400px] w-full relative">
                    <canvas id="chipChart"></canvas>
                </div>
                <p class="text-xs text-gray-500 mt-4 text-center">* 資料來源：集保中心 Open Data，每週六更新</p>
            </div>
        </div>

    </div>

    <!-- 這是最關鍵的 Script 區塊 -->
    <script>
        let globalDaily = [];
        let globalHistory = {};
        let globalWeeklyUp = [];
        let globalWeeklyTurn = [];
        let globalHolders = {};
        let chipChartInstance = null;

        function switchTab(tabId) {
            ['daily', 'history', 'weekly', 'holders'].forEach(id => {
                document.getElementById(`content-${id}`).style.display = 'none';
                document.getElementById(`tab-${id}`).classList.remove('active');
            });
            document.getElementById(`content-${tabId}`).style.display = 'block';
            document.getElementById(`tab-${tabId}`).classList.add('active');
        }

        function getColor(val) {
            const num = parseFloat(val);
            if (isNaN(num)) return 'text-gray-300';
            if (num > 0) return 'text-up font-medium';
            if (num < 0) return 'text-down font-medium';
            return 'text-gray-300';
        }

        function getStrategyBadges(stratArrayOrStr) {
            if (!stratArrayOrStr) return '';
            const list = Array.isArray(stratArrayOrStr) ? stratArrayOrStr : String(stratArrayOrStr).split(',');
            return list.map(s => {
                const cleanS = s.trim();
                if (!cleanS) return '';
                
                let colorClass = 'bg-gray-800 text-gray-300 border-gray-700'; 
                
                if (cleanS.includes('S1_')) colorClass = 'bg-purple-900/60 text-purple-300 border-purple-700/50';
                else if (cleanS.includes('S2_')) colorClass = 'bg-red-900/60 text-red-300 border-red-700/50';
                else if (cleanS.includes('S3_')) colorClass = 'bg-amber-900/60 text-amber-300 border-amber-700/50';
                else if (cleanS.includes('S4_')) colorClass = 'bg-emerald-900/60 text-emerald-300 border-emerald-700/50';
                else if (cleanS.includes('S5_')) colorClass = 'bg-cyan-900/60 text-cyan-300 border-cyan-700/50';
                else if (cleanS.includes('S6_')) colorClass = 'bg-blue-900/60 text-blue-300 border-blue-700/50';
                else if (cleanS.includes('S7_')) colorClass = 'bg-pink-900/60 text-pink-300 border-pink-700/50';
                else if (cleanS.includes('👑')) colorClass = 'badge-gold font-semibold';
                else if (cleanS.includes('⚡')) colorClass = 'bg-orange-500/20 text-orange-300 border-orange-500/50 font-semibold';
                else if (cleanS.startsWith('🐳')) colorClass = 'bg-indigo-500/20 text-indigo-300 border-indigo-500/50 font-semibold';
                
                return `<span class="inline-block px-2.5 py-0.5 text-xs rounded-full border ${colorClass} mr-1.5 mb-1">${cleanS}</span>`;
            }).join('');
        }

        async function safeFetchJSON(url) {
            try {
                const res = await fetch(url + '?t=' + new Date().getTime());
                if (res.ok) {
                    return await res.json();
                }
            } catch (e) {
                console.warn(`讀取 ${url} 失敗:`, e);
            }
            return null;
        }

        async function initData() {
            const dataDaily = await safeFetchJSON('data/daily_picks.json');
            if (dataDaily) {
                document.getElementById('update-time').innerText = `最後更新：${dataDaily.date || '未知'}`;
                globalDaily = dataDaily.picks || [];
                renderDaily();
            } else {
                document.getElementById('daily-container').innerHTML = '<p class="text-red-400">無法載入今日選股資料，檔案可能尚未生成。</p>';
            }

            const dataHist = await safeFetchJSON('data/history.json');
            if (dataHist) {
                globalHistory = dataHist;
                try {
                    renderHistory();
                } catch(e) {
                    console.error("渲染歷史表格出錯:", e);
                }
            }

            const dataWUp = await safeFetchJSON('data/weekly_uptrend.json');
            if (dataWUp) {
                globalWeeklyUp = dataWUp.stocks || [];
                renderWeeklyArray('weekly-uptrend-container', globalWeeklyUp);
            }

            const dataWTurn = await safeFetchJSON('data/weekly_turn.json');
            if (dataWTurn) {
                globalWeeklyTurn = dataWTurn.stocks || [];
                renderWeeklyArray('weekly-turn-container', globalWeeklyTurn);
            }

            const dataHolders = await safeFetchJSON('data/holders.json');
            if (dataHolders) {
                globalHolders = dataHolders;
            }
        }

        function renderDaily() {
            const container = document.getElementById('daily-container');
            container.innerHTML = '';
            if (!globalDaily || globalDaily.length === 0) {
                container.innerHTML = '<p class="text-gray-500">今日無符合條件之標的。</p>';
                return;
            }

            globalDaily.forEach(s => {
                const card = document.createElement('div');
                card.className = "bg-cardbg rounded-xl p-5 border border-gray-800 hover:border-gray-600 transition-colors";
                
                let chipHtml = '';
                if (s['外資動向'] && s['投信動向']) {
                    chipHtml = `
                    <div class="mt-4 pt-4 border-t border-gray-800 grid grid-cols-2 gap-2 text-sm">
                        <div><span class="text-gray-500 text-xs">外資</span><br><span class="text-gray-300">${s['外資動向']}</span></div>
                        <div><span class="text-gray-500 text-xs">投信</span><br><span class="text-gray-300">${s['投信動向']}</span></div>
                    </div>`;
                }

                let revHtml = '';
                if (s.MoM && s.YoY) {
                    revHtml = `
                    <div class="mt-2 grid grid-cols-2 gap-2 text-sm">
                        <div><span class="text-gray-500 text-xs">MoM</span><br><span class="${getColor(s.MoM)}">${s.MoM}</span></div>
                        <div><span class="text-gray-500 text-xs">YoY</span><br><span class="${getColor(s.YoY)}">${s.YoY}</span></div>
                    </div>`;
                }

                card.innerHTML = `
                    <div class="flex justify-between items-start mb-3">
                        <div>
                            <h3 class="text-xl font-bold text-white flex items-center gap-2">
                                <a href="https://tw.stock.yahoo.com/quote/${s.代碼}" target="_blank" class="hover:text-blue-400 transition-colors">${s.代碼} ${s.名稱}</a>
                                <span class="text-xs font-normal text-gray-500 bg-gray-800 px-2 py-0.5 rounded">${s.市場}</span>
                            </h3>
                            <p class="text-gray-400 mt-1">收盤：<span class="text-white font-medium">${s.收盤價}</span> | 量：${s['成交量(張)']} 張</p>
                        </div>
                    </div>
                    <div class="mb-3">
                        ${getStrategyBadges(s.strats)}
                    </div>
                    <p class="text-sm text-gray-400">距年高點跌幅：<span class="text-gray-300">${s.距年高點跌幅 || '-'}</span></p>
                    ${revHtml}
                    ${chipHtml}
                `;
                container.appendChild(card);
            });
        }

        function renderHistory() {
            const tbody = document.getElementById('history-tbody');
            const filter = document.getElementById('strat-filter').value;
            tbody.innerHTML = '';

            let allRecords = [];
            for (const [ticker, records] of Object.entries(globalHistory)) {
                records.forEach(r => {
                    const code = ticker.replace('.TW', '').replace('.TWO', '');
                    const strats = String(r.strategies || ""); 
                    if (filter === 'ALL' || strats.includes(filter) || (filter === '🐳' && strats.includes('🐳'))) {
                        allRecords.push({ code, strats, ...r });
                    }
                });
            }

            allRecords.sort((a, b) => new Date(b.pick_date) - new Date(a.pick_date));

            if (allRecords.length === 0) {
                tbody.innerHTML = '<tr><td colspan="8" class="text-center py-6 text-gray-500">查無歷史選股紀錄</td></tr>';
                return;
            }

            allRecords.forEach(r => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-gray-800/50 transition-colors";
                
                const entryP = parseFloat(r.entry_price) || 0;
                const curP = parseFloat(r.current_price) || entryP;
                const highP = parseFloat(r.highest_price) || curP; 
                const retPct = parseFloat(r.return_pct) || 0;
                const maxRetPct = parseFloat(r.max_return_pct) || 0;

                let mfeClass = 'text-gray-300';
                let mfeText = maxRetPct.toFixed(2) + '%';
                if (maxRetPct >= 15.0) {
                    mfeClass = 'text-yellow-300 font-bold badge-gold px-2 py-0.5 rounded';
                    mfeText = '🔥 ' + mfeText;
                } else if (maxRetPct >= 8.0) {
                    mfeClass = 'text-emerald-400 font-medium';
                }

                tr.innerHTML = `
                    <td class="px-4 py-3 font-medium text-white">
                        <a href="https://tw.tradingview.com/symbols/TWSE-${r.code}/" target="_blank" class="hover:text-blue-400">${r.code} ${r.name || ''}</a>
                    </td>
                    <td class="px-4 py-3 text-gray-400 whitespace-nowrap">${r.pick_date || '-'}</td>
                    <td class="px-4 py-3 max-w-[250px] leading-relaxed">
                        ${getStrategyBadges(r.strats)}
                    </td>
                    <td class="px-4 py-3 text-right text-gray-300">${entryP.toFixed(2)}</td>
                    <td class="px-4 py-3 text-right font-medium text-white">${curP.toFixed(2)}</td>
                    <td class="px-4 py-3 text-right text-blue-300">${highP.toFixed(2)}</td>
                    <td class="px-4 py-3 text-right ${getColor(retPct)}">${retPct > 0 ? '+'+retPct.toFixed(2) : retPct.toFixed(2)}%</td>
                    <td class="px-4 py-3 text-right">
                        <span class="${mfeClass}">${mfeText}</span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderWeeklyArray(containerId, dataArray) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            if (!dataArray || dataArray.length === 0) {
                container.innerHTML = '<p class="text-gray-500">無資料</p>';
                return;
            }
            dataArray.forEach(s => {
                const badge = document.createElement('a');
                badge.href = `https://tw.stock.yahoo.com/quote/${s.代碼}`;
                badge.target = "_blank";
                badge.className = "bg-gray-800 hover:bg-gray-700 text-gray-200 px-3 py-1.5 rounded-lg border border-gray-700 text-sm transition-colors";
                badge.innerText = `${s.代碼} ${s.名稱}`;
                container.appendChild(badge);
            });
        }

        function drawChipChart() {
            const code = document.getElementById('chip-input').value.trim();
            if (!code) return;

            if (!globalHolders[code]) {
                alert(`資料庫中目前沒有 ${code} 的每週集保紀錄。`);
                return;
            }

            const data = globalHolders[code];
            const ctx = document.getElementById('chipChart').getContext('2d');

            if (chipChartInstance) {
                chipChartInstance.destroy();
            }

            chipChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.dates,
                    datasets: [
                        {
                            label: '400張以上大戶比例 (%)',
                            data: data.p400,
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59, 130, 246, 0.1)',
                            borderWidth: 2,
                            tension: 0.3,
                            fill: true
                        },
                        {
                            label: '1000張以上大戶比例 (%)',
                            data: data.p1000,
                            borderColor: '#f59e0b',
                            backgroundColor: 'rgba(245, 158, 11, 0.1)',
                            borderWidth: 2,
                            tension: 0.3,
                            fill: true
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: {
                        legend: { labels: { color: '#cbd5e1' } },
                        tooltip: {
                            backgroundColor: 'rgba(15, 23, 42, 0.9)',
                            titleColor: '#fff',
                            bodyColor: '#cbd5e1',
                            borderColor: '#334155',
                            borderWidth: 1
                        }
                    },
                    scales: {
                        x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
                        y: { 
                            grid: { color: '#334155' }, 
                            ticks: { color: '#94a3b8' },
                            title: { display: true, text: '持股比例 %', color: '#94a3b8' }
                        }
                    }
                }
            });
        }

        window.onload = initData;
    </script>
</body>
</html>
